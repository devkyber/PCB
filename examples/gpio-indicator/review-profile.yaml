  - id: bench
    prompt: Record low-voltage bench current, independent-channel behavior and useful brightness before use.
    rationale: This educational example is unbuilt and has no measured performance.
    evidence_refs: [REQUIREMENTS.md]
    safety_tags: [qualification]
