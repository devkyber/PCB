schema_version: 1
rules:
  - pattern: .gitattributes
    action: KEEP
    rationale: Preserve exact evidence archive bytes without line-ending normalization.
  - pattern: .gitignore
    action: KEEP
    rationale: Repository ignore policy remains authoritative.
  - pattern: pyproject.toml
    action: KEEP
    rationale: Root Python workspace configuration.
  - pattern: uv.lock
    action: KEEP
    rationale: Reproducible Python dependency lock.
  - pattern: README.md
    action: KEEP
    rationale: Canonical repository purpose and entry point.
  - pattern: CLAUDE.md
    action: KEEP
    rationale: Concise current agent contract; links to canonical progress and workflow rather than duplicating them.
  - pattern: HUMAN_WORK.md
    action: GENERATED
    rationale: Recreate human work from project-specific review state.
    replacement: pcb-copilot review
  - pattern: .claude/**
    action: REFACTOR
    rationale: Preserve automation behavior while moving platform logic to portable hooks.
    replacement: src/pcb_copilot/hooks.py
  - pattern: docs/superpowers/**
    action: KEEP
    rationale: Approved design and implementation records.
  - pattern: docs/archive/**
    action: DELETE
    rationale: Audited 2026-09-20; obsolete V2 history and duplicate relay/ADC tutorial removed. Current board decisions remain in canonical project records; originals are recoverable from Git.
    replacement: projects/tms-v3/PDR.md
  - pattern: docs/QUICKSTART.md
    action: DELETE
    rationale: Superseded operator guidance was consolidated into the canonical workflow.
    replacement: docs/WORKFLOW.md
  - pattern: docs/SETUP.md
    action: DELETE
    rationale: Durable routing safety was consolidated into the canonical workflow; host-specific setup was stale.
    replacement: docs/WORKFLOW.md
  - pattern: docs/pcb-design-workflow.md
    action: DELETE
    rationale: Superseded operator guidance and old defect chronology removed at owner request; current guidance and recurring-defect lessons remain in WORKFLOW and ARCHITECTURE. Full chronology is recoverable from Git.
    replacement: docs/WORKFLOW.md
  - pattern: docs/pcb-design-rules.md
    action: DELETE
    rationale: Detailed original moved intact with non-authoritative warning; canonical rule index retains exact scope and links to provenance.
    replacement: docs/history/legacy-design-rules.md
  - pattern: docs/tms-v3-pdr.md
    action: DELETE
    rationale: Moved beside the board with explicit historical conflicts; preserved unique design/review history without endorsing stale approval.
    replacement: projects/tms-v3/PDR.md
  - pattern: docs/history/**
    action: KEEP
    rationale: Detailed rule provenance retained until fact-level migration; current reports and deviations still use its stable rule IDs. Obsolete workflow chronology was removed.
  - pattern: docs/ARCHITECTURE.md
    action: KEEP
    rationale: Canonical architecture and recurring-defect record.
  - pattern: docs/*.py
    action: REFACTOR
    rationale: Preserve tested workflow behavior behind package APIs and compatibility commands.
    replacement: src/pcb_copilot
  - pattern: docs/*.md
    action: KEEP
    rationale: Maintained documentation not yet assigned a narrower migration rule.
  - pattern: projects/*/STATUS.md
    action: GENERATED
    rationale: Status is reproducible local state rather than design authority.
    replacement: pcb-copilot status
  - pattern: projects/*/PIPELINE.json
    action: GENERATED
    rationale: Preserve hashes and drift behavior in local lifecycle state.
    replacement: projects/*/.pcb-copilot/state.json
  - pattern: projects/*/EVALUATION.md
    action: MERGE
    rationale: Retain current findings in requirements, design basis, deviations, or limitations.
    replacement: projects/*/DESIGN_BASIS.md
  - pattern: projects/baro-bmp390/EVALUATION.md
    action: DELETE
    rationale: Audited current pin map, bulk-cap rationale, address, sizing and test-point facts are in canonical board records; old routing counts and disproven bulk verdict not migrated.
    replacement: projects/baro-bmp390/DESIGN_BASIS.md
  - pattern: projects/imu-icm42688/EVALUATION.md
    action: DELETE
    rationale: Audited current capacitor, reserved-pin grounding, SPI, dimensions and mechanical facts are in canonical board records; false NC and measured-noise claims not migrated.
    replacement: projects/imu-icm42688/DESIGN_BASIS.md
  - pattern: projects/gnss-neom9n/EVALUATION.md
    action: KEEP
    rationale: Accepted schematic Description fields and live generators still cite this file; retained until a reviewed metadata migration, not current design authority.
  - pattern: projects/tms-v3/tms-v3-bom.md
    action: GENERATED
    rationale: Generate the BOM from the accepted PCB.
    replacement: pcb-copilot release
  - pattern: projects/*/build.sh
    action: REFACTOR
    rationale: Replace board-specific shell orchestration with portable commands.
    replacement: pcb-copilot
  - pattern: projects/*/gen_*_sch.py
    action: REFACTOR
    rationale: Preserve circuit intent and renderer behavior before retiring generators.
    replacement: projects/*/schematic-intent.yaml
  - pattern: projects/*/gen_*_pcb.py
    action: REFACTOR
    rationale: Preserve placement and routing intent before retiring generators.
    replacement: projects/*/layout-intent.yaml
  - pattern: projects/*/datasheets/**
    action: MERGE
    rationale: Move verified documents into the unified evidence archive.
    replacement: projects/*/evidence/index.yaml
  - pattern: projects/*/reference-designs/**
    action: MERGE
    rationale: Move cited reference designs into the unified evidence archive.
    replacement: projects/*/evidence/index.yaml
  - pattern: projects/*/*.kicad_sch
    action: KEEP
    rationale: Accepted electrical source of truth.
  - pattern: projects/*/*.kicad_pcb
    action: KEEP
    rationale: Accepted physical source of truth.
  - pattern: projects/*/*.kicad_pro
    action: KEEP
    rationale: KiCad project configuration.
  - pattern: projects/*/netmap.json
    action: KEEP
    rationale: Reviewable schematic-to-PCB connectivity contract.
  - pattern: projects/**
    action: KEEP
    rationale: Project evidence, libraries, requirements, decisions, and sign-off remain preserved.
  - pattern: src/**
    action: KEEP
    rationale: Replacement package implementation.
  - pattern: tests/**
    action: KEEP
    rationale: Characterization and regression protection.
  - pattern: scripts/**
    action: KEEP
    rationale: Versioned migration and maintenance commands.
  - pattern: migration/**
    action: KEEP
    rationale: Auditable preservation and cleanup inventory.
  - pattern: tools/kicad-claude-mcp/**
    action: KEEP
    rationale: Proven KiCad editing, routing, hierarchy, sourcing, and manufacturing implementation.
  - pattern: tools/kicad-jlcpcb/**
    action: MERGE
    rationale: Retain useful JLCPCB lookup and export behavior behind the copilot package.
    replacement: src/pcb_copilot
  - pattern: tools/kicad-happy/**
    action: MERGE
    rationale: Retain useful evidence and review guidance without maintaining a separate product tree.
    replacement: docs/WORKFLOW.md
