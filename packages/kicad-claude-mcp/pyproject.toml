[project]
name = "kicad-claude-mcp"
version = "0.1.0"
description = "Local KiCad file, geometry and routing adapters used by PCB Copilot."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Grigory Filimonov" }]
dependencies = ["sexpdata>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_claude"]
