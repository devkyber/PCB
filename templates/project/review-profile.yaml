schema_version: 1
# The shared loader always adds schematic-readability and layout-handover
# release items. Add project-specific items here; shared.* IDs are reserved.
items:
  - id: requirements
    prompt: Review the circuit and layout against the actual product requirements.
    rationale: Automated checks cannot infer missing product intent.
    evidence_refs: [REQUIREMENTS.md]
    safety_tags: [general]
  - id: parts
    prompt: Verify exact physical parts, pinouts, footprints, and orderable BOM.
    rationale: CAD parity does not establish real-component fit or sourcing.
    evidence_refs: [DESIGN_BASIS.md]
    safety_tags: [assembly, sourcing]
  - id: physical
    prompt: Inspect mechanical fit, power/return paths, silkscreen, and bench behavior.
    rationale: DRC does not establish system behavior.
    evidence_refs: [REQUIREMENTS.md]
    safety_tags: [mechanical, power]
